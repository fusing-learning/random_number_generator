<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Generator</title>
    <style>
        :root {
            font-family: system-ui, sans-serif;
            font-synthesis: none;
            line-height: 1.5;
            color-scheme: light;
        }

        * { box-sizing: border-box; }

        body {
            --page: #f1f4f8;
            --surface: #fff;
            --inset: #eef3fa;
            --text: #17253a;
            --muted: #4e6078;
            --line: #ccd6e3;
            --input-line: #8292aa;
            --accent: #175ac0;
            --accent-hover: #10499e;
            --selected: #dceaff;
            --error: #a52532;
            --success: #236137;
            --warning: #754700;
            --warning-bg: #fff1d6;
            margin: 0;
            color: var(--text);
            background: var(--page);
        }

        body.dark-mode {
            color-scheme: dark;
            --page: #121821;
            --surface: #1b2431;
            --inset: #222f40;
            --text: #eff5ff;
            --muted: #adc0d8;
            --line: #3a4a60;
            --input-line: #788da8;
            --accent: #91bcff;
            --accent-hover: #b0cfff;
            --selected: #283f61;
            --error: #ffabb2;
            --success: #99dbab;
            --warning: #ffdb91;
            --warning-bg: #3e301a;
        }

        main {
            width: min(100% - 32px, 960px);
            margin: clamp(24px, 6vw, 80px) auto;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: clamp(16px, 3vw, 32px);
        }

        h1 {
            margin: 0;
            font-size: clamp(1.6rem, 4.5vw, 3rem);
            line-height: 1.08;
            letter-spacing: -0.045em;
            text-wrap: balance;
        }

        .theme-switch {
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 44px;
            padding: 0 12px;
            background: var(--surface);
            border: 1px solid var(--input-line);
            border-radius: 8px;
            font-size: 0.875rem;
            white-space: nowrap;
            cursor: pointer;
        }

        .workspace {
            display: grid;
            grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
            align-items: start;
            gap: 16px;
        }

        .panel {
            min-width: 0;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: clamp(16px, 3vw, 28px);
        }

        .range-fields {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .form-group { margin: 0 0 16px; min-width: 0; }
        .mode-group { margin-bottom: 22px; }
        fieldset { padding: 0; border: 0; }
        legend { padding: 0; }
        .field-label, legend {
            display: block;
            margin-bottom: 6px;
            font-size: 0.875rem;
            font-weight: 650;
        }

        input, button { font: inherit; }
        input[type="radio"], input[type="checkbox"] {
            accent-color: var(--accent);
            margin: 0;
        }

        input[type="number"] {
            width: 100%;
            min-width: 0;
            min-height: 44px;
            padding: 8px 10px;
            border: 1px solid var(--input-line);
            border-radius: 8px;
            background: var(--surface);
            color: var(--text);
            font-variant-numeric: tabular-nums;
        }

        :is(input, button):focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        button {
            min-height: 44px;
            padding: 8px 14px;
            border: 1px solid transparent;
            border-radius: 8px;
            font-weight: 650;
            cursor: pointer;
        }

        .generate {
            width: 100%;
            color: var(--surface);
            background: var(--accent);
        }

        .generate:hover { background: var(--accent-hover); }

        .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 6px;
            min-height: 44px;
            padding: 6px 9px;
            border: 1px solid var(--input-line);
            border-radius: 8px;
            font-size: 0.875rem;
            cursor: pointer;
        }

        .radio-option:has(:checked) {
            background: var(--selected);
            border-color: var(--accent);
        }

        .mode-group .radio-option { flex: 1; justify-content: center; }

        #duplication-control {
            display: none;
            margin-bottom: 16px;
            padding: 12px;
            border-radius: 8px;
            background: var(--inset);
        }

        #duplication-control p { margin: 0 0 10px; }
        #duplication-control p:last-child { margin: 10px 0 0; }
        .utility-buttons { display: flex; gap: 8px; margin-bottom: 10px; }
        .utility-button {
            color: var(--text);
            background: var(--surface);
            border-color: var(--input-line);
            font-size: 0.875rem;
        }
        .utility-button:hover { background: var(--selected); }

        #number-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 116px), 1fr));
            gap: 8px;
            max-height: 280px;
            overflow: auto;
            padding: 4px;
        }

        .number-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 0.875rem;
        }

        .number-control label { overflow-wrap: anywhere; }
        .number-control input { width: 66px; flex: none; }

        .timestamp-input {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
            align-items: center;
            gap: 4px;
        }

        .timestamp-input input { text-align: center; padding-inline: 4px; }
        .timestamp-units { color: var(--muted); font-weight: 400; }

        .results h2 { margin: 0 0 12px; font-size: 1.125rem; }
        .result-empty { color: var(--muted); }
        .result-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 85px), 1fr));
            gap: 8px;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .result-list li {
            padding: 10px 8px;
            border-radius: 8px;
            color: var(--text);
            background: var(--inset);
            text-align: center;
            font: 650 clamp(1rem, 2.5vw, 1.625rem)/1.2 ui-monospace, monospace;
            overflow-wrap: anywhere;
        }

        .error, .result-empty { margin: 0; text-wrap: pretty; }
        .error, .total-invalid { color: var(--error); }
        .total-valid { color: var(--success); }
        .warning {
            color: var(--warning);
            background: var(--warning-bg);
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        @media (max-width: 680px) {
            .workspace { grid-template-columns: minmax(0, 1fr); }
        }

        @media (max-width: 360px) {
            #timestamps-form .range-fields { grid-template-columns: minmax(0, 1fr); }
        }
    </style>
</head>
<body>

    <main>
        <header class="page-header">
            <h1>Random Generator</h1>
            <label class="theme-switch">
                <input type="checkbox" id="theme-toggle">
                Dark mode
            </label>
        </header>

        <div class="workspace">
            <section class="panel" aria-label="Generator settings">
                <fieldset class="form-group mode-group">
                    <legend>Mode</legend>
                    <div class="radio-group">
                        <label class="radio-option">
                            <input type="radio" id="modeNumbers" name="mode" value="numbers" checked onchange="toggleMode()">
                            Numbers
                        </label>
                        <label class="radio-option">
                            <input type="radio" id="modeTimestamps" name="mode" value="timestamps" onchange="toggleMode()">
                            Timestamps
                        </label>
                    </div>
                </fieldset>

                <div id="numbers-form">
                    <div class="range-fields">
                        <div class="form-group">
                            <label class="field-label" for="lowerLimit">Minimum</label>
                            <input type="number" id="lowerLimit" value="1" min="0" oninput="onLimitChange()">
                        </div>

                        <div class="form-group">
                            <label class="field-label" for="upperLimit">Maximum</label>
                            <input type="number" id="upperLimit" value="100" min="1" oninput="onLimitChange()">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="field-label" for="numberCount">How many numbers?</label>
                        <input type="number" id="numberCount" value="1" min="1" oninput="normalizeNumberCount()">
                    </div>

                    <fieldset class="form-group">
                        <legend>Allow duplicates?</legend>
                        <div class="radio-group">
                            <label class="radio-option">
                                <input type="radio" id="allowDuplicatesNo" name="allowDuplicates" value="no" checked onchange="toggleDuplicationControl()">
                                No
                            </label>
                            <label class="radio-option">
                                <input type="radio" id="allowDuplicatesYes" name="allowDuplicates" value="yes" onchange="toggleDuplicationControl()">
                                Yes
                            </label>
                        </div>
                    </fieldset>

                    <div id="duplication-control">
                        <p><strong>Specify how many times each number can appear:</strong></p>
                        <div id="range-warning" style="display: none;"></div>
                        <div class="utility-buttons">
                            <button class="utility-button" onclick="fillAllRandomly()">Fill All</button>
                            <button class="utility-button" onclick="clearAll()">Clear All</button>
                        </div>
                        <div id="number-controls"></div>
                        <p><small>Total must equal <span id="totalRequired">5</span></small></p>
                    </div>

                    <fieldset class="form-group">
                        <legend>Sort order</legend>
                        <div class="radio-group">
                            <label class="radio-option">
                                <input type="radio" id="sortNo" name="sortResults" value="no" checked>
                                Random
                            </label>
                            <label class="radio-option">
                                <input type="radio" id="sortAscend" name="sortResults" value="ascend">
                                Ascending
                            </label>
                            <label class="radio-option">
                                <input type="radio" id="sortDescend" name="sortResults" value="descend">
                                Descending
                            </label>
                        </div>
                    </fieldset>

                    <button class="generate" onclick="generateRandomNumbers()">Generate Numbers</button>
                </div>

                <div id="timestamps-form" hidden>
                    <div class="range-fields">
                        <div class="form-group">
                            <span class="field-label">Start <span class="timestamp-units">(min:sec)</span></span>
                            <div class="timestamp-input">
                                <input type="number" id="lowerMinutes" aria-label="Start minutes" value="0" min="0" placeholder="MM">
                                <span class="timestamp-separator">:</span>
                                <input type="number" id="lowerSeconds" aria-label="Start seconds" value="0" min="0" max="59" placeholder="SS">
                            </div>
                        </div>

                        <div class="form-group">
                            <span class="field-label">End <span class="timestamp-units">(min:sec)</span></span>
                            <div class="timestamp-input">
                                <input type="number" id="upperMinutes" aria-label="End minutes" value="1" min="0" placeholder="MM">
                                <span class="timestamp-separator">:</span>
                                <input type="number" id="upperSeconds" aria-label="End seconds" value="0" min="0" max="59" placeholder="SS">
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="field-label" for="timestampCount">How many timestamps?</label>
                        <input type="number" id="timestampCount" value="1" min="1" oninput="normalizeTimestampCount()">
                    </div>

                    <button class="generate" onclick="generateRandomTimestamps()">Generate Timestamps</button>
                </div>
            </section>

            <section class="panel results" aria-labelledby="results-heading">
                <h2 id="results-heading">Results</h2>
                <div id="output" aria-live="polite" aria-atomic="true">
                    <p class="result-empty">Generated values will appear here.</p>
                </div>
            </section>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggle = document.getElementById('theme-toggle');

            // Function to set the theme
            const setTheme = (isDark) => {
                if (isDark) {
                    document.body.classList.add('dark-mode');
                    themeToggle.checked = true;
                    localStorage.setItem('theme', 'dark');
                } else {
                    document.body.classList.remove('dark-mode');
                    themeToggle.checked = false;
                    localStorage.setItem('theme', 'light');
                }
            };

            // Event listener for the toggle
            themeToggle.addEventListener('change', () => {
                setTheme(themeToggle.checked);
            });

            // Check for saved theme in localStorage
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                setTheme(savedTheme === 'dark');
            } else {
                // Optional: check for user's system preference
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                setTheme(prefersDark);
            }

            // Initial calls to set up the generator state
            normalizeNumberCount();
            toggleDuplicationControl();
        });


        function normalizeNumberCount() {
            const countInput = document.getElementById('numberCount');
            let count = parseFloat(countInput.value);
            
            if (count !== Math.floor(count)) {
                count = Math.floor(count);
                countInput.value = count;
            }
            
            if (count < 1) {
                count = 1;
                countInput.value = count;
            }
            
            document.getElementById('totalRequired').textContent = count;
            
            updateDuplicationControlState();
            
            if (document.querySelector('input[name="allowDuplicates"]:checked').value === 'yes') {
                generateDuplicationControls();
            }
        }

        function onLimitChange() {
            const lowerInput = document.getElementById('lowerLimit');
            const upperInput = document.getElementById('upperLimit');
            
            let lowerValue = parseFloat(lowerInput.value);
            let upperValue = parseFloat(upperInput.value);
            
            if (lowerValue !== Math.floor(lowerValue)) {
                lowerValue = Math.floor(lowerValue);
                lowerInput.value = lowerValue;
            }
            
            if (upperValue !== Math.floor(upperValue)) {
                upperValue = Math.floor(upperValue);
                upperInput.value = upperValue;
            }
            
            if (lowerValue < 0) {
                lowerValue = 0;
                lowerInput.value = lowerValue;
            }
            
            if (upperValue < 1) {
                upperValue = 1;
                upperInput.value = upperValue;
            }
            
            if (document.querySelector('input[name="allowDuplicates"]:checked').value === 'yes') {
                generateDuplicationControls();
            }
        }

        function updateDuplicationControlState() {
            const count = parseInt(document.getElementById('numberCount').value);
            const allowDuplicatesNo = document.getElementById('allowDuplicatesNo');
            const allowDuplicatesYes = document.getElementById('allowDuplicatesYes');
            
            if (count === 1) {
                allowDuplicatesNo.checked = true;
                allowDuplicatesYes.disabled = true;
                document.getElementById('duplication-control').style.display = 'none';
            } else {
                allowDuplicatesYes.disabled = false;
            }
        }

        function toggleDuplicationControl() {
            const allowDuplicates = document.querySelector('input[name="allowDuplicates"]:checked').value;
            const duplicationControl = document.getElementById('duplication-control');
            
            if (allowDuplicates === 'yes') {
                duplicationControl.style.display = 'block';
                generateDuplicationControls();
            } else {
                duplicationControl.style.display = 'none';
            }
        }

        function generateDuplicationControls() {
            const min = parseInt(document.getElementById('lowerLimit').value);
            const max = parseInt(document.getElementById('upperLimit').value);
            const count = parseInt(document.getElementById('numberCount').value);
            const controlsContainer = document.getElementById('number-controls');
            const warningContainer = document.getElementById('range-warning');
            
            if (isNaN(min) || isNaN(max) || min >= max) {
                controlsContainer.innerHTML = '<p class="error">Please set valid Lower and Upper limits first.</p>';
                return;
            }

            const rangeSize = max - min + 1;
            
            if (rangeSize > 200) {
                warningContainer.innerHTML = '<p class="warning">⚠️ Large range detected! Ranges over 200 numbers may cause performance issues. Consider using a smaller range for better performance.</p>';
                warningContainer.style.display = 'block';
            } else {
                warningContainer.style.display = 'none';
            }

            controlsContainer.innerHTML = '';
            
            for (let i = min; i <= max; i++) {
                const controlDiv = document.createElement('div');
                controlDiv.className = 'number-control';
                controlDiv.innerHTML = `
                    <label>${i}:</label>
                    <input type="number" id="count-${i}" value="0" min="0" max="${count}" oninput="validateDuplicationTotal()" onfocus="this.select()">
                `;
                controlsContainer.appendChild(controlDiv);
            }
            
            validateDuplicationTotal();
        }

        function validateDuplicationTotal() {
            const totalRequired = parseInt(document.getElementById('numberCount').value);
            const min = parseInt(document.getElementById('lowerLimit').value);
            const max = parseInt(document.getElementById('upperLimit').value);
            
            let currentTotal = 0;
            let numbersWithZero = [];
            
            for (let i = min; i <= max; i++) {
                const input = document.getElementById(`count-${i}`);
                if (input) {
                    const value = parseInt(input.value) || 0;
                    currentTotal += value;
                    if (value === 0) {
                        numbersWithZero.push(i);
                    }
                }
            }
            
            if (numbersWithZero.length === 1 && currentTotal < totalRequired) {
                const remainingCount = totalRequired - currentTotal;
                const lastNumberInput = document.getElementById(`count-${numbersWithZero[0]}`);
                if (lastNumberInput && remainingCount > 0) {
                    lastNumberInput.value = remainingCount;
                    currentTotal += remainingCount;
                }
            }
            
            const totalElement = document.getElementById('totalRequired');
            if (currentTotal === totalRequired) {
                totalElement.className = 'total-valid';
                totalElement.textContent = `${totalRequired} ✓`;
            } else {
                totalElement.className = 'total-invalid';
                totalElement.textContent = `${totalRequired} (currently: ${currentTotal})`;
            }
        }

        function generateRandomNumbers() {
            const min = parseInt(document.getElementById('lowerLimit').value);
            const max = parseInt(document.getElementById('upperLimit').value);
            const count = parseInt(document.getElementById('numberCount').value);
            const allowDuplicates = document.querySelector('input[name="allowDuplicates"]:checked').value;
            const sortOption = document.querySelector('input[name="sortResults"]:checked').value;
            const output = document.getElementById('output');

            if (isNaN(min) || isNaN(max) || isNaN(count) || min >= max || count <= 0) {
                output.innerHTML = '<p class="error">Invalid input! Please enter valid integers where the minimum is below the maximum and the count is positive.</p>';
                return;
            }

            let randomNumbers = [];

            if (allowDuplicates === 'no') {
                const availableNumbers = max - min + 1;
                if (count > availableNumbers) {
                    output.innerHTML = `<p class="error">Cannot generate ${count} unique numbers from range ${min}-${max}. Maximum unique numbers available: ${availableNumbers}</p>`;
                    return;
                }

                const availablePool = [];
                for (let i = min; i <= max; i++) {
                    availablePool.push(i);
                }

                for (let i = 0; i < count; i++) {
                    const randomIndex = Math.floor(Math.random() * availablePool.length);
                    randomNumbers.push(availablePool.splice(randomIndex, 1)[0]);
                }
            } else {
                let totalSpecified = 0;
                for (let i = min; i <= max; i++) {
                    const input = document.getElementById(`count-${i}`);
                    if (input) {
                        totalSpecified += parseInt(input.value) || 0;
                    }
                }

                if (totalSpecified !== count) {
                    output.innerHTML = `<p class="error">The total count of specified duplications (${totalSpecified}) must equal the number of numbers to generate (${count}).</p>`;
                    return;
                }

                for (let i = min; i <= max; i++) {
                    const input = document.getElementById(`count-${i}`);
                    if (input) {
                        const numberCount = parseInt(input.value) || 0;
                        for (let j = 0; j < numberCount; j++) {
                            randomNumbers.push(i);
                        }
                    }
                }

                for (let i = randomNumbers.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [randomNumbers[i], randomNumbers[j]] = [randomNumbers[j], randomNumbers[i]];
                }
            }

            if (sortOption === 'ascend') {
                randomNumbers.sort((a, b) => a - b);
            } else if (sortOption === 'descend') {
                randomNumbers.sort((a, b) => b - a);
            }

            showResults(randomNumbers);
        }

        function fillAllRandomly() {
            const min = parseInt(document.getElementById('lowerLimit').value);
            const max = parseInt(document.getElementById('upperLimit').value);
            const totalRequired = parseInt(document.getElementById('numberCount').value);
            
            if (isNaN(min) || isNaN(max) || isNaN(totalRequired) || min >= max) {
                return;
            }
            
            for (let i = min; i <= max; i++) {
                const input = document.getElementById(`count-${i}`);
                if (input) {
                    input.value = '0';
                }
            }
            
            let remainingTotal = totalRequired;
            const numbers = [];
            for (let i = min; i <= max; i++) {
                numbers.push(i);
            }
            
            while (remainingTotal > 0) {
                const randomIndex = Math.floor(Math.random() * numbers.length);
                const randomNumber = numbers[randomIndex];
                const input = document.getElementById(`count-${randomNumber}`);
                if (input) {
                    const currentValue = parseInt(input.value) || 0;
                    input.value = currentValue + 1;
                    remainingTotal--;
                }
            }
            
            validateDuplicationTotal();
        }

        function clearAll() {
            const min = parseInt(document.getElementById('lowerLimit').value);
            const max = parseInt(document.getElementById('upperLimit').value);
            
            if (isNaN(min) || isNaN(max) || min >= max) {
                return;
            }
            
            for (let i = min; i <= max; i++) {
                const input = document.getElementById(`count-${i}`);
                if (input) {
                    input.value = '0';
                }
            }
            
            validateDuplicationTotal();
        }

        function showResults(values) {
            const output = document.getElementById('output');
            const list = document.createElement('ul');
            list.className = 'result-list';
            list.setAttribute('role', 'list');
            for (const value of values) {
                const item = document.createElement('li');
                item.textContent = value;
                list.append(item);
            }
            output.replaceChildren(list);
        }

        function toggleMode() {
            const mode = document.querySelector('input[name="mode"]:checked').value;
            const numbersForm = document.getElementById('numbers-form');
            const timestampsForm = document.getElementById('timestamps-form');
            const output = document.getElementById('output');

            numbersForm.hidden = mode !== 'numbers';
            timestampsForm.hidden = mode !== 'timestamps';
            output.innerHTML = '<p class="result-empty">Generated values will appear here.</p>';
        }

        function normalizeTimestampCount() {
            const countInput = document.getElementById('timestampCount');
            let count = parseFloat(countInput.value);

            if (count !== Math.floor(count)) {
                count = Math.floor(count);
                countInput.value = count;
            }

            if (count < 1) {
                count = 1;
                countInput.value = count;
            }
        }

        function parseTimestampFromInputs(minutesId, secondsId) {
            const minutes = parseInt(document.getElementById(minutesId).value);
            const seconds = parseInt(document.getElementById(secondsId).value);

            if (isNaN(minutes) || isNaN(seconds) || minutes < 0 || seconds < 0 || seconds >= 60) {
                return null;
            }

            return minutes * 60 + seconds;
        }

        function formatTimestamp(totalSeconds) {
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            return `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        function generateRandomTimestamps() {
            const count = parseInt(document.getElementById('timestampCount').value);
            const output = document.getElementById('output');

            const lowerSeconds = parseTimestampFromInputs('lowerMinutes', 'lowerSeconds');
            const upperSeconds = parseTimestampFromInputs('upperMinutes', 'upperSeconds');

            if (lowerSeconds === null) {
                output.innerHTML = '<p class="error">Invalid Lower Timestamp! Minutes must be ≥ 0 and seconds must be 0-59.</p>';
                return;
            }

            if (upperSeconds === null) {
                output.innerHTML = '<p class="error">Invalid Upper Timestamp! Minutes must be ≥ 0 and seconds must be 0-59.</p>';
                return;
            }

            if (lowerSeconds >= upperSeconds) {
                output.innerHTML = '<p class="error">Lower Timestamp must be less than Upper Timestamp.</p>';
                return;
            }

            if (isNaN(count) || count <= 0) {
                output.innerHTML = '<p class="error">Invalid count! Please enter a positive number.</p>';
                return;
            }

            const availableTimestamps = upperSeconds - lowerSeconds + 1;
            if (count > availableTimestamps) {
                const lowerFormatted = formatTimestamp(lowerSeconds);
                const upperFormatted = formatTimestamp(upperSeconds);
                output.innerHTML = `<p class="error">Cannot generate ${count} unique timestamps from range ${lowerFormatted}-${upperFormatted}. Maximum unique timestamps available: ${availableTimestamps}</p>`;
                return;
            }

            const availablePool = [];
            for (let i = lowerSeconds; i <= upperSeconds; i++) {
                availablePool.push(i);
            }

            const randomTimestamps = [];
            for (let i = 0; i < count; i++) {
                const randomIndex = Math.floor(Math.random() * availablePool.length);
                randomTimestamps.push(availablePool.splice(randomIndex, 1)[0]);
            }

            const formattedTimestamps = randomTimestamps.map(formatTimestamp);
            showResults(formattedTimestamps);
        }
    </script>

</body>
</html>
